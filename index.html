<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retrowave Racer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #3a0a6e 0%, #1a0436 40%, #07000f 100%);
    font-family: 'Press Start 2P', monospace;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  }
  canvas {
    display: block;
    border: 3px solid #c14bff;
    border-radius: 8px;
    box-shadow: 0 0 25px #c14bff, 0 0 80px rgba(106, 0, 255, .7);
  }
  #hint { color: #00eaff; font-size: 11px; letter-spacing: 2px; text-shadow: 0 0 8px #00eaff; }
  #legend {
    position: fixed; left: 24px; top: 50%; transform: translateY(-50%);
    width: 270px; padding: 16px 18px; z-index: 2;
    background: rgba(10, 0, 25, .78); color: #e9f6ff;
    border: 2px solid #c14bff; border-radius: 10px;
    box-shadow: 0 0 20px #c14bff, inset 0 0 30px rgba(106, 0, 255, .3);
  }
  #legend h2 { font-size: 12px; margin: 6px 0 14px; text-shadow: 0 0 8px currentColor; }
  #legend .li { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  #legend img { width: 38px; height: 38px; image-rendering: pixelated; flex: none; filter: drop-shadow(0 0 6px var(--g)); }
  #legend b { display: block; font-size: 10px; margin-bottom: 6px; color: var(--g); }
  #legend span { font-size: 7px; line-height: 1.6; color: #cfa6ff; }
  @media (max-width: 1100px) { #legend { display: none; } }
</style>
</head>
<body>
<aside id="legend" aria-label="Leyenda de objetos"></aside>
<div id="wrap">
  <canvas id="game" aria-label="Juego Retrowave Racer"></canvas>
  <div id="hint">&larr; &rarr; CAMBIAR CARRIL &nbsp;|&nbsp; ENTER JUGAR</div>
</div>

<script>
// =====================================================
//  RETROWAVE RACER
// =====================================================
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = 640, H = 720;
const DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR;
ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

// Tamaño en pantalla: centrado, cerca de la mitad del ancho, sin estirar
function fit() {
  let h = window.innerHeight * 0.86, w = h * W / H;
  const maxW = window.innerWidth * 0.55;
  if (w > maxW) { w = maxW; h = w * H / W; }
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
}
addEventListener('resize', fit); fit();

// ---------- Cámara / perspectiva real ----------
const HOR = H * 0.40, VX = W / 2;
const ZN = 1, ZF = 70, K = 135;      // cerca, lejos, escala
const PZ = 1.2;                      // distancia del coche del jugador
const CARW = 0.85;                   // ancho del coche (mundo)
const sy = z => HOR + (H - HOR) * ZN / z;
const sx = (x, z) => VX + x * K * ZN / z;
const sc = z => ZN / z;
const fog = z => z > ZF - 18 ? Math.max(0, (ZF - z) / 18) : 1;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

function makeLayer() {
  const c = document.createElement('canvas');
  c.width = W * DPR; c.height = H * DPR;
  const g = c.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0);
  return [c, g];
}

// =====================================================
//  CIELO (capas fijas, se dibujan una vez)
// =====================================================
const [skyC, sg] = makeLayer();
(function () {
  const gr = sg.createLinearGradient(0, 0, 0, HOR);
  gr.addColorStop(0, '#0b0120'); gr.addColorStop(0.35, '#22064a');
  gr.addColorStop(0.7, '#5a0f7a'); gr.addColorStop(0.9, '#b0207e'); gr.addColorStop(1, '#ff4f9a');
  sg.fillStyle = gr; sg.fillRect(0, 0, W, HOR + 1);
  // nebulosas
  [[130, 70, 170, 'rgba(0,200,255,0.12)'], [520, 100, 210, 'rgba(255,60,200,0.14)'], [330, 30, 190, 'rgba(140,60,255,0.14)']]
    .forEach(([x, y, r, c]) => {
      const g = sg.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, c); g.addColorStop(1, 'rgba(0,0,0,0)');
      sg.fillStyle = g; sg.fillRect(0, 0, W, HOR);
    });
  // brillo del sol
  const gl = sg.createRadialGradient(VX, HOR, 40, VX, HOR, 340);
  gl.addColorStop(0, 'rgba(255,90,170,0.6)'); gl.addColorStop(1, 'rgba(255,90,170,0)');
  sg.fillStyle = gl; sg.fillRect(0, 0, W, HOR);
  // planeta con anillo
  const px0 = 105, py0 = 80, pr = 24;
  sg.strokeStyle = 'rgba(255,140,230,0.85)'; sg.lineWidth = 3;
  sg.beginPath(); sg.ellipse(px0, py0, pr * 1.9, pr * 0.45, -0.35, Math.PI, Math.PI * 2); sg.stroke();
  const pg = sg.createRadialGradient(px0 - 8, py0 - 8, 3, px0, py0, pr);
  pg.addColorStop(0, '#9af6ff'); pg.addColorStop(0.5, '#5b6cff'); pg.addColorStop(1, '#3a0a6e');
  sg.fillStyle = pg; sg.beginPath(); sg.arc(px0, py0, pr, 0, Math.PI * 2); sg.fill();
  sg.beginPath(); sg.ellipse(px0, py0, pr * 1.9, pr * 0.45, -0.35, 0, Math.PI); sg.stroke();
  // luna pequeña
  sg.fillStyle = 'rgba(255,220,255,0.85)'; sg.beginPath(); sg.arc(560, 55, 9, 0, Math.PI * 2); sg.fill();
  sg.fillStyle = '#1a0540'; sg.beginPath(); sg.arc(565, 51, 8, 0, Math.PI * 2); sg.fill();
})();

// SOL: semicírculo real con bandas retrowave
const [sunC, ug] = makeLayer();
(function () {
  const R = 175;
  const gr = ug.createLinearGradient(0, HOR - R, 0, HOR);
  gr.addColorStop(0, '#fff36b'); gr.addColorStop(0.4, '#ffb43a');
  gr.addColorStop(0.7, '#ff6a4a'); gr.addColorStop(1, '#ff2a8a');
  ug.shadowColor = '#ff4fd8'; ug.shadowBlur = 45;
  ug.fillStyle = gr;
  ug.beginPath(); ug.moveTo(VX - R, HOR); ug.arc(VX, HOR, R, Math.PI, 0); ug.closePath(); ug.fill();
  ug.shadowBlur = 0;
  ug.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 7; i++) {
    const h = 9 - i * 1.2, y = HOR - 6 - i * 17 - h;
    ug.fillRect(VX - R - 5, y, R * 2 + 10, h);
  }
  ug.globalCompositeOperation = 'source-over';
})();

// MONTAÑAS + SKYLINE lejano
const [horC, hg] = makeLayer();
(function () {
  function mountain(pts) {
    const g = hg.createLinearGradient(0, HOR - 110, 0, HOR);
    g.addColorStop(0, '#2a0a55'); g.addColorStop(1, '#12022a');
    hg.fillStyle = g;
    hg.beginPath(); hg.moveTo(pts[0][0], HOR);
    pts.forEach(p => hg.lineTo(p[0], p[1]));
    hg.lineTo(pts[pts.length - 1][0], HOR); hg.closePath(); hg.fill();
    hg.strokeStyle = 'rgba(255,79,216,0.35)'; hg.lineWidth = 1;
    pts.forEach((p, i) => {
      if (i % 2 === 1) {
        hg.beginPath(); hg.moveTo(p[0], p[1]); hg.lineTo(p[0] - 28, HOR);
        hg.moveTo(p[0], p[1]); hg.lineTo(p[0] + 28, HOR); hg.stroke();
      }
    });
    hg.shadowColor = '#ff4fd8'; hg.shadowBlur = 10; hg.strokeStyle = '#ff6ae0'; hg.lineWidth = 2;
    hg.beginPath(); pts.forEach((p, i) => i ? hg.lineTo(p[0], p[1]) : hg.moveTo(p[0], p[1])); hg.stroke();
    hg.shadowBlur = 0;
  }
  const left = [[-10, HOR - 20], [35, HOR - 70], [75, HOR - 40], [120, HOR - 105], [165, HOR - 50], [200, HOR - 20], [215, HOR]];
  mountain(left);
  mountain(left.map(([x, y]) => [W - x, y]).reverse());

  // ciudad lejana en el horizonte
  const WC = ['#ff4fd8', '#00eaff', '#ffd84a'];
  let x = 0;
  while (x < W) {
    const bw = rand(10, 24), bh = rand(8, 42);
    if (x + bw < 230 || x > 410) {
      hg.fillStyle = '#0d0120'; hg.fillRect(x, HOR - bh, bw, bh);
      for (let wy = HOR - bh + 3; wy < HOR - 2; wy += 4)
        for (let wx = 2; wx < bw - 2; wx += 4)
          if (Math.random() < 0.3) { hg.fillStyle = pick(WC); hg.fillRect(x + wx, wy, 1.5, 1.5); }
    }
    x += bw + rand(0, 4);
  }
  hg.fillStyle = '#ff4fd8'; hg.shadowColor = '#ff4fd8'; hg.shadowBlur = 12;
  hg.fillRect(0, HOR - 1, W, 2); hg.shadowBlur = 0;
})();

const stars = Array.from({ length: 150 }, () => ({
  x: Math.random() * W, y: Math.random() * (HOR - 30),
  r: Math.random() < 0.15 ? 2 : 1, p: Math.random() * 6.28, s: rand(1, 3)
}));
const clouds = Array.from({ length: 5 }, () => ({
  x: rand(0, W), y: HOR - rand(40, 150), w: rand(120, 260), h: rand(5, 11), v: rand(3, 8)
}));
let shoot = null, shootT = 3;

// =====================================================
//  COCHES PIXEL ART (sprite 42x34, visto por detrás)
// =====================================================
const FONT = {
  '0': ['111', '101', '101', '101', '111'], '1': ['010', '110', '010', '010', '111'],
  '2': ['111', '001', '111', '100', '111'], '3': ['111', '001', '111', '001', '111'],
  '4': ['101', '101', '111', '001', '001'], '5': ['111', '100', '111', '001', '111'],
  '6': ['111', '100', '111', '101', '111'], '7': ['111', '001', '010', '010', '010'],
  '8': ['111', '101', '111', '101', '111'], '9': ['111', '101', '111', '001', '111'],
  'R': ['110', '101', '110', '101', '101'], 'W': ['101', '101', '101', '111', '101'],
  'K': ['101', '110', '100', '110', '101'], 'X': ['101', '101', '010', '101', '101'],
  'N': ['111', '101', '101', '101', '101'], 'E': ['111', '100', '110', '100', '111'],
  'O': ['111', '101', '101', '101', '111'], 'I': ['111', '010', '010', '010', '111'],
  '-': ['000', '000', '111', '000', '000'], ' ': ['000', '000', '000', '000', '000']
};

function makeCar(p, plate) {
  const c = document.createElement('canvas'); c.width = 42; c.height = 34;
  const g = c.getContext('2d');
  const R = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x + 1, y + 1, w, h); };
  // ruedas
  R(0, 20, 6, 12, '#0a0912'); R(34, 20, 6, 12, '#0a0912');
  for (const wx of [1, 35]) for (let ty = 22; ty < 31; ty += 3) R(wx, ty, 4, 1, '#2c2a3c');
  // techo
  R(11, 2, 18, 3, p.body); R(12, 2, 16, 1, p.light);
  // pilares
  R(9, 5, 2, 7, p.body); R(29, 5, 2, 7, p.body); R(9, 5, 1, 7, p.dark);
  // luneta trasera con reflejos
  R(11, 5, 18, 7, p.glass); R(11, 5, 18, 1, p.dark);
  for (let i = 0; i < 5; i++) R(13 + i, 10 - i, 2, 1, '#7fdcff');
  R(19, 6, 3, 1, '#4fb6e0'); R(23, 10, 4, 1, '#2a6c99');
  // tercera luz de freno
  R(16, 4, 8, 1, '#ff2a44');
  // retrovisores
  R(4, 9, 4, 3, p.body); R(4, 9, 4, 1, p.light); R(32, 9, 4, 3, p.body); R(32, 9, 4, 1, p.light);
  R(8, 10, 1, 1, p.dark); R(31, 10, 1, 1, p.dark);
  // alerón
  R(3, 12, 34, 2, '#17121f'); R(3, 12, 34, 1, '#3b3150');
  // maletero
  R(5, 14, 30, 5, p.body); R(10, 14, 20, 1, p.light); R(5, 14, 1, 5, p.dark); R(34, 14, 1, 5, p.dark);
  // pilotos traseros
  R(5, 16, 9, 3, '#a00c24'); R(6, 17, 7, 1, '#ff4458'); R(6, 16, 2, 1, '#ffc0c8');
  R(26, 16, 9, 3, '#a00c24'); R(27, 17, 7, 1, '#ff4458'); R(32, 16, 2, 1, '#ffc0c8');
  // barra neón y logo
  R(14, 17, 12, 1, p.light); R(19, 15, 2, 1, '#e8e8ff');
  // parte baja
  R(4, 19, 32, 7, p.body); R(4, 19, 32, 1, p.dark); R(4, 19, 1, 7, p.dark); R(35, 19, 1, 7, p.dark);
  // matrícula
  R(10, 20, 20, 7, '#e9ecf5'); R(10, 20, 20, 1, '#9aa0b5'); R(10, 26, 20, 1, '#9aa0b5');
  [...plate].forEach((ch, i) => {
    (FONT[ch] || FONT[' ']).forEach((row, ry) => [...row].forEach((v, rx) => {
      if (v === '1') R(11 + i * 4 + rx, 21 + ry, 1, 1, '#14143a');
    }));
  });
  // parachoques, difusor y escapes
  R(3, 27, 34, 2, '#1b1828'); R(3, 27, 34, 1, '#3a3552'); R(13, 29, 14, 1, '#0f0d18');
  R(6, 29, 3, 2, '#6b6b7a'); R(7, 30, 1, 1, '#111'); R(31, 29, 3, 2, '#6b6b7a'); R(32, 30, 1, 1, '#111');
  // contorno pixel
  const id = g.getImageData(0, 0, 42, 34), d = id.data;
  const on = (x, y) => x >= 0 && y >= 0 && x < 42 && y < 34 && d[(y * 42 + x) * 4 + 3] > 0;
  const edge = [];
  for (let y = 0; y < 34; y++) for (let x = 0; x < 42; x++)
    if (!on(x, y) && (on(x - 1, y) || on(x + 1, y) || on(x, y - 1) || on(x, y + 1))) edge.push([x, y]);
  g.fillStyle = '#07020f'; edge.forEach(([x, y]) => g.fillRect(x, y, 1, 1));
  return c;
}

const PALS = [
  { body: '#e8253a', dark: '#8a0f1e', light: '#ff9aa6', glass: '#1a0612' },
  { body: '#14b8ff', dark: '#08609a', light: '#9fe6ff', glass: '#06142a' },
  { body: '#8e3cff', dark: '#4a149c', light: '#cfa6ff', glass: '#120626' },
  { body: '#ff8a1c', dark: '#9c4a06', light: '#ffd09a', glass: '#1e1006' },
  { body: '#e6e6f0', dark: '#7a7a92', light: '#ffffff', glass: '#101828' },
  { body: '#22d39a', dark: '#0b7a55', light: '#a6ffe0', glass: '#062018' },
];
const randPlate = () => pick([...'RWKXNEO']) + pick([...'RWKXNEO']) + '-' + Math.floor(rand(0, 10)) + Math.floor(rand(0, 10));
const ENEMY_SPR = PALS.map(p => makeCar(p, randPlate()));
const PLAYER_SPR = makeCar({ body: '#ff2bd6', dark: '#8c0b79', light: '#ffb3f2', glass: '#071a33' }, 'KIRO8');

// ---------- Objetos pixel art (16x16) ----------
function pixSprite(draw) {
  const c = document.createElement('canvas'); c.width = c.height = 16;
  const g = c.getContext('2d');
  const R = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  const C = (cx, cy, r, col) => { for (let y = -r; y <= r; y++) { const w = Math.round(Math.sqrt(r * r - y * y)); R(cx - w, cy + y, w * 2, 1, col); } };
  draw(R, C);
  return c;
}
const ITEM_SPR = {
  coin: pixSprite((R, C) => {
    C(8, 8, 7, '#8a5a00'); C(8, 8, 6, '#ffd84a'); C(8, 8, 4, '#ffe98a');
    R(7, 4, 2, 9, '#c08a10'); R(4, 7, 9, 2, '#c08a10'); R(5, 3, 2, 1, '#fff6c0');
  }),
  shield: pixSprite(R => {
    // escudo heráldico: borde plateado, centro azul, estrella
    const half = y => y <= 8 ? 7 : Math.max(0, Math.round(7 - (y - 8) * 1.1));
    for (let y = 0; y < 16; y++) { const h = half(y); if (h > 0) R(8 - h, y, h * 2, 1, '#0a1f4a'); }
    for (let y = 1; y < 15; y++) { const h = half(y) - 1; if (h > 0) R(8 - h, y, h * 2, 1, '#d8ecff'); }
    for (let y = 2; y < 14; y++) { const h = half(y) - 2; if (h > 0) R(8 - h, y, h * 2, 1, y < 6 ? '#3f9bff' : '#1a62e0'); }
    R(3, 3, 1, 6, '#8fd0ff');
    R(7, 4, 2, 7, '#ffffff'); R(5, 6, 6, 2, '#ffffff'); R(6, 9, 1, 1, '#ffffff'); R(9, 9, 1, 1, '#ffffff');
    R(2, 1, 1, 1, '#ffffff'); R(13, 1, 1, 1, '#ffffff');
  }),
  x2: pixSprite(R => {
    R(1, 3, 14, 10, '#2a0a55'); R(2, 4, 12, 8, '#b14bff');
    [['X', 4], ['2', 9]].forEach(([ch, ox]) =>
      FONT[ch].forEach((row, ry) => [...row].forEach((v, rx) => { if (v === '1') R(ox + rx, 5 + ry, 1, 1, '#ffffff'); })));
  }),
  clock: pixSprite((R, C) => {
    C(8, 9, 6, '#14143a'); C(8, 9, 5, '#e9f6ff');
    R(8, 5, 1, 5, '#14143a'); R(8, 9, 4, 1, '#14143a'); R(6, 1, 5, 2, '#9af6ff');
  }),
  fog: pixSprite((R, C) => {
    C(5, 10, 4, '#3a3050'); C(10, 9, 5, '#3a3050'); C(8, 6, 4, '#3a3050');
    C(5, 10, 3, '#a89fc4'); C(10, 9, 4, '#a89fc4'); C(8, 6, 3, '#c9c2e0');
    R(3, 13, 2, 2, '#ff3a5a'); R(11, 13, 2, 2, '#ff3a5a');
  }),
};
const ITEM_GLOW = { coin: '255,216,74', shield: '0,234,255', x2: '177,75,255', clock: '154,246,255', fog: '255,40,60' };

// ---------- Leyenda a la izquierda (fuera del juego) ----------
function puddleIcon(col, sheen) {
  return pixSprite(R => {
    const rows = [[6, 4], [7, 6], [8, 7], [9, 7], [10, 6], [11, 4]];
    rows.forEach(([y, h]) => R(8 - h, y, h * 2, 1, '#ff3a5a'));
    rows.forEach(([y, h]) => { if (h > 1) R(9 - h, y, h * 2 - 2, 1, col); });
    if (sheen) { R(5, 8, 2, 1, '#b14bff'); R(7, 8, 2, 1, '#22d39a'); R(9, 8, 2, 1, '#00eaff'); }
    else { R(4, 8, 2, 1, '#3a200c'); R(10, 9, 2, 1, '#3a200c'); }
  });
}
(function buildLegend() {
  const icons = { ...ITEM_SPR, oil: puddleIcon('#05030a', true), mud: puddleIcon('#5a3416', false) };
  const rows = [
    ['h', 'BONUS', '#22d39a'],
    ['coin', 'MONEDA', '+250 puntos', '#ffd84a'],
    ['shield', 'ESCUDO', 'Aguanta 1 choque (8 s)', '#4aa8ff'],
    ['x2', 'PUNTOS X2', 'Puntos dobles (7 s)', '#b14bff'],
    ['clock', 'RELOJ', 'Camara lenta (4 s)', '#9af6ff'],
    ['h', 'TRAMPAS', '#ff3a5a'],
    ['oil', 'ACEITE', 'Flechas al reves (4 s)', '#ff3a5a'],
    ['mud', 'BARRO', 'Vas lento, casi sin puntos (3 s)', '#d08a40'],
    ['fog', 'NIEBLA', 'No ves lo que viene (5 s)', '#ff3a5a'],
  ];
  const el = document.getElementById('legend');
  el.innerHTML = rows.map(r => r[0] === 'h'
    ? `<h2 style="color:${r[2]}">${r[1]}</h2>`
    : `<div class="li" style="--g:${r[3]}"><img src="${icons[r[0]].toDataURL()}" alt="${r[1]}"><div><b>${r[1]}</b><span>${r[2]}</span></div></div>`
  ).join('');
})();

// nubes de niebla (volumen)
const fogPuffs = Array.from({ length: 26 }, () => ({
  x: rand(-80, W + 80), y: rand(HOR - 70, sy(8) + 10), r: rand(60, 140),
  v: rand(-14, 14), p: Math.random() * 6, dark: Math.random() < 0.35
}));
const fogWisps = Array.from({ length: 8 }, () => ({
  x: rand(-80, W + 80), y: rand(sy(8), H), r: rand(80, 160), v: rand(-20, 20), p: Math.random() * 6
}));

// =====================================================
//  CIUDAD A LOS LADOS (vienen hacia ti)
// =====================================================
const WINC = ['#ff4fd8', '#00eaff', '#ffd84a', '#b77bff', '#00eaff'];
const B_PER_SIDE = 16, B_GAP = 4.3, B_SPAN = B_PER_SIDE * B_GAP;
function newBuilding(side, z) {
  const width = rand(1.4, 3.6), h = rand(3, 12);
  const cols = Math.max(2, Math.floor(width / 0.45)), rows = Math.max(3, Math.floor(h / 0.6));
  const lit = [];
  for (let i = 0; i < cols * rows; i++) lit.push(Math.random() < 0.45 ? pick(WINC) : null);
  return {
    type: 'b', side, z, inner: rand(2.9, 4.4), width, h, d: rand(1.5, 3.8), cols, rows, lit,
    body: pick(['#1d0840', '#250a4d', '#170536', '#2c0d58']),
    neon: Math.random() < 0.6 ? pick(['#ff3fd8', '#00eaff', '#ffd23f', '#b14bff']) : null,
    sign: Math.random() < 0.35, antenna: Math.random() < 0.4, phase: Math.random() * 6
  };
}
const buildings = [];
for (const s of [-1, 1]) for (let i = 0; i < B_PER_SIDE; i++) buildings.push(newBuilding(s, 2 + i * B_GAP + rand(0, 1.5)));

const L_PER_SIDE = 10, L_GAP = 7;
const lamps = [];
for (const s of [-1, 1]) for (let i = 0; i < L_PER_SIDE; i++)
  lamps.push({ type: 'l', side: s, z: 1.5 + i * L_GAP + (s > 0 ? 3.5 : 0), col: i % 2 ? '#00eaff' : '#ff4fd8' });

// =====================================================
//  TOP 10
// =====================================================
const KEY = 'retrowave_top10';
const loadTop = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } };
function pushScore(name, s) {
  const l = loadTop(), e = { name, score: s };
  l.push(e); l.sort((a, b) => b.score - a.score);
  const top = l.slice(0, 10);
  localStorage.setItem(KEY, JSON.stringify(top));
  return top.indexOf(e);
}
function qualifies(s) { const l = loadTop(); return s > 0 && (l.length < 10 || s > l[l.length - 1].score); }

// =====================================================
//  ESTADO
// =====================================================
let state = 'menu', time = 0, travel = 0, speed = 12, level = 1, score = 0;
let spawnT = 1, flash = 0, flashRGB = '255,80,200', lvlBanner = 0, nameBuf = '', lastRank = -1;
const player = { lane: 1, xw: -0.5 };
let obs = [], items = [], popups = [], itemT = 2;
// efectos activos (segundos que quedan)
const fx = { shield: 0, x2: 0, slow: 0, invert: 0, mud: 0, fog: 0 };
const laneXw = l => l - 1.5;

function reset() {
  state = 'play'; score = 0; level = 1; speed = 12; obs = []; items = []; popups = [];
  spawnT = rand(0.6, 1.4); itemT = rand(1.5, 3);
  for (const k in fx) fx[k] = 0;
  player.lane = Math.floor(rand(0, 4)); player.xw = laneXw(player.lane); lastRank = -1; lvlBanner = 0;
}
function crash() {
  flash = 0.6; flashRGB = '255,80,200'; nameBuf = '';
  state = qualifies(Math.floor(score)) ? 'name' : 'over';
}

// barajado justo (todos los carriles igual de probables)
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function laneBusy(l) {
  return obs.some(o => o.lane === l && o.z > ZF - 9) || items.some(it => it.lane === l && it.z > ZF - 6);
}
const effSpeed = () => speed * (fx.slow > 0 ? 0.55 : 1) * (fx.mud > 0 ? 0.6 : 1);
const popup = (text, col) => popups.push({ text, col, t: 1.4 });

const GOOD = ['coin', 'coin', 'shield', 'x2', 'clock'];
const BAD = ['oil', 'mud', 'fog'];
function applyItem(kind) {
  switch (kind) {
    case 'coin':   score += 250; popup('+250', '#ffd84a'); break;
    case 'shield': fx.shield = 8; popup('ESCUDO!', '#00eaff'); break;
    case 'x2':     fx.x2 = 7; popup('PUNTOS X2', '#b14bff'); break;
    case 'clock':  fx.slow = 4; fx.mud = 0; popup('CAMARA LENTA', '#9af6ff'); break;
    case 'oil':    fx.invert = 4; popup('CONTROLES AL REVES!', '#ff3a5a'); break;
    case 'mud':    fx.mud = 3; popup('BARRO! VAS LENTO', '#d08a40'); break;
    case 'fog':    fx.fog = 5; popup('NIEBLA!', '#ff3a5a'); break;
  }
}

function update(dt) {
  time += dt;
  const ws = state === 'play' ? effSpeed() : state === 'menu' ? 7 : 0;
  travel += ws * dt;

  for (const b of buildings) {
    b.z -= ws * dt;
    if (b.z + b.d < 1.2) Object.assign(b, newBuilding(b.side, b.z + B_SPAN));
  }
  for (const l of lamps) { l.z -= ws * dt; if (l.z < 0.9) l.z += L_PER_SIDE * L_GAP; }

  if (state === 'play') {
    score += ws * dt * 2.6 * (fx.x2 > 0 ? 2 : 1) * (fx.mud > 0 ? 0.3 : 1);
    const nl = Math.floor(score / 1000) + 1;
    if (nl > level) { level = nl; lvlBanner = 2; }
    // cada 1000 puntos: mucho más rápido (acelera suave)
    const target = Math.min(55, 12 + (level - 1) * 4.5);
    speed += (target - speed) * Math.min(1, dt * 1.5);
    for (const k in fx) fx[k] = Math.max(0, fx[k] - dt);

    // coches: carril al azar justo, a veces en TU carril
    spawnT -= dt;
    if (spawnT <= 0) {
      spawnT = Math.max(0.36, 1.05 - (level - 1) * 0.09) * rand(0.8, 1.2);
      let lanes = shuffle([0, 1, 2, 3]).filter(l => !laneBusy(l));
      if (Math.random() < 0.3 && lanes.includes(player.lane))
        lanes = [player.lane, ...lanes.filter(l => l !== player.lane)];
      const n = Math.min(lanes.length, (level >= 3 && Math.random() < 0.4) ? 2 : 1);
      for (let i = 0; i < n; i++)
        obs.push({ type: 'o', lane: lanes[i], xw: laneXw(lanes[i]), z: ZF - 2, spr: pick(ENEMY_SPR) });
    }
    // objetos: bonus y trampas
    itemT -= dt;
    if (itemT <= 0) {
      itemT = rand(1.6, 3.2);
      const free = shuffle([0, 1, 2, 3]).filter(l => !laneBusy(l));
      if (free.length) {
        const kind = Math.random() < 0.55 ? pick(GOOD) : pick(BAD);
        items.push({ type: 'i', kind, lane: free[0], xw: laneXw(free[0]), z: ZF - 2, ph: Math.random() * 6 });
      }
    }
    // cambio de carril suave
    player.xw += (laneXw(player.lane) - player.xw) * (1 - Math.exp(-14 * dt));

    for (const o of obs) {
      o.z -= ws * dt;
      if (Math.abs(o.z - PZ) < 0.55 && Math.abs(o.xw - player.xw) < 0.7) {
        if (fx.shield > 0) {
          fx.shield = 0; o.dead = true; flash = 0.4; flashRGB = '0,234,255';
          popup('ESCUDO ROTO', '#00eaff');
        } else { crash(); return; }
      }
    }
    obs = obs.filter(o => !o.dead && o.z > 0.5);
    for (const it of items) {
      it.z -= ws * dt;
      if (Math.abs(it.z - PZ) < 0.6 && Math.abs(it.xw - player.xw) < 0.7) { applyItem(it.kind); it.dead = true; }
    }
    items = items.filter(it => !it.dead && it.z > 0.5);
  }
  for (const p of popups) p.t -= dt;
  popups = popups.filter(p => p.t > 0);

  lvlBanner = Math.max(0, lvlBanner - dt);
  flash = Math.max(0, flash - dt);
  for (const c of clouds) { c.x += c.v * dt; if (c.x - c.w / 2 > W) c.x = -c.w / 2; }
  for (const p of [...fogPuffs, ...fogWisps]) {
    p.x += p.v * dt;
    if (p.x - p.r > W) p.x = -p.r; else if (p.x + p.r < 0) p.x = W + p.r;
  }
  shootT -= dt;
  if (shootT <= 0 && !shoot) { shoot = { x: rand(150, W), y: rand(10, HOR * 0.5), vx: -rand(350, 500), vy: rand(120, 200), life: 0.9 }; shootT = rand(4, 9); }
  if (shoot) { shoot.x += shoot.vx * dt; shoot.y += shoot.vy * dt; shoot.life -= dt; if (shoot.life <= 0) shoot = null; }
}

// =====================================================
//  DIBUJO
// =====================================================
function poly(pts, fill) {
  ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fill();
}
function strip(xw, hw, z1, z2, fill) {
  poly([[sx(xw - hw, z1), sy(z1)], [sx(xw + hw, z1), sy(z1)], [sx(xw + hw, z2), sy(z2)], [sx(xw - hw, z2), sy(z2)]], fill);
}
function glow(x, y, r, rgb, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}

function drawSky() {
  ctx.drawImage(skyC, 0, 0, W, H);
  for (const s of stars) {
    const a = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(time * s.s + s.p));
    ctx.fillStyle = `rgba(255,235,255,${a})`; ctx.fillRect(s.x, s.y, s.r, s.r);
  }
  if (shoot) {
    const g = ctx.createLinearGradient(shoot.x, shoot.y, shoot.x - shoot.vx * 0.12, shoot.y - shoot.vy * 0.12);
    g.addColorStop(0, 'rgba(255,255,255,0.95)'); g.addColorStop(1, 'rgba(255,120,230,0)');
    ctx.strokeStyle = g; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(shoot.x, shoot.y); ctx.lineTo(shoot.x - shoot.vx * 0.12, shoot.y - shoot.vy * 0.12); ctx.stroke();
  }
  ctx.drawImage(sunC, 0, 0, W, H);
  for (const c of clouds) {
    ctx.fillStyle = 'rgba(30,4,60,0.55)';
    ctx.beginPath(); ctx.ellipse(c.x, c.y, c.w / 2, c.h / 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,120,220,0.18)';
    ctx.fillRect(c.x - c.w * 0.35, c.y - c.h / 2, c.w * 0.7, 1);
  }
  ctx.drawImage(horC, 0, 0, W, H);
}

function drawGround() {
  const g = ctx.createLinearGradient(0, HOR, 0, H);
  g.addColorStop(0, '#2a0750'); g.addColorStop(0.3, '#14022e'); g.addColorStop(1, '#08001a');
  ctx.fillStyle = g; ctx.fillRect(0, HOR, W, H - HOR);
  // rejilla neón que viene hacia ti
  const per = 2.5, off = travel % per;
  ctx.lineWidth = 1;
  for (let z = 0.9 + per - off; z < ZF; z += per) {
    const y = sy(z);
    ctx.strokeStyle = `rgba(190,80,255,${0.45 * fog(z)})`;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(190,80,255,0.4)';
  for (let i = 0; i < 16; i++) {
    const xw = 2.3 + i * 1.8;
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(sx(s * xw, 0.9), sy(0.9)); ctx.lineTo(sx(s * xw, ZF), sy(ZF)); ctx.stroke();
    }
  }
}

function drawRoad() {
  const g = ctx.createLinearGradient(0, HOR, 0, H);
  g.addColorStop(0, '#1a0533'); g.addColorStop(1, '#0e0220');
  strip(0, 2.15, 0.9, ZF, g);
  // reflejo del sol en el asfalto
  const rg = ctx.createLinearGradient(0, HOR, 0, HOR + 140);
  rg.addColorStop(0, 'rgba(255,90,180,0.25)'); rg.addColorStop(1, 'rgba(255,90,180,0)');
  strip(0, 2.1, 0.9, ZF, rg);
  // arcén: líneas suaves con brillo
  for (const s of [-1, 1]) {
    strip(s * 2.1, 0.16, 0.9, ZF, 'rgba(0,234,255,0.15)');
    strip(s * 2.1, 0.045, 0.9, ZF, '#00eaff');
  }
  // líneas de carril
  const per = 3.2, len = 1.5, off = travel % per;
  for (let z = 0.9 - off; z < ZF; z += per) {
    const z1 = Math.max(0.9, z), z2 = Math.min(ZF, z + len);
    if (z2 <= z1) continue;
    ctx.globalAlpha = fog(z1);
    for (const xw of [-1, 0, 1]) strip(xw, 0.04, z1, z2, '#ff6ae0');
  }
  ctx.globalAlpha = 1;
}

function drawBuilding(b) {
  const a = fog(b.z); if (a <= 0) return;
  ctx.globalAlpha = a;
  const s = b.side, xin = s * b.inner, xout = s * (b.inner + b.width);
  const zf = Math.max(b.z, 0.35), zb = b.z + b.d;
  const hN = b.h * K * sc(zf), hF = b.h * K * sc(zb);
  // cara lateral (mira a la carretera)
  poly([[sx(xin, zf), sy(zf)], [sx(xin, zf), sy(zf) - hN], [sx(xin, zb), sy(zb) - hF], [sx(xin, zb), sy(zb)]], '#0f0322');
  ctx.strokeStyle = b.neon || '#7a2bd6'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(sx(xin, zf), sy(zf) - hN); ctx.lineTo(sx(xin, zb), sy(zb) - hF); ctx.stroke();
  if (b.z >= 0.35) {
    const k = K * sc(b.z);
    const x1 = sx(xin, b.z), x2 = sx(xout, b.z), L = Math.min(x1, x2), Wd = Math.abs(x2 - x1);
    const yb = sy(b.z), ht = b.h * k, yt = yb - ht;
    ctx.fillStyle = b.body; ctx.fillRect(L, yt, Wd, ht);
    // ventanas
    const cw = Wd / b.cols, ch = ht / b.rows;
    if (cw > 2.2) {
      for (let r = 0; r < b.rows; r++) for (let c = 0; c < b.cols; c++) {
        const col = b.lit[r * b.cols + c]; if (!col) continue;
        ctx.fillStyle = col;
        ctx.fillRect(L + c * cw + cw * 0.22, yt + r * ch + ch * 0.25, cw * 0.56, ch * 0.45);
      }
    }
    // borde neón superior
    ctx.fillStyle = b.neon || '#9b3cff';
    ctx.fillRect(L, yt, Wd, Math.max(1, 0.08 * k));
    // cartel neón vertical
    if (b.sign && b.neon) {
      const sxp = s < 0 ? x1 - 0.45 * k : x1 + 0.15 * k;
      ctx.fillStyle = b.neon; ctx.fillRect(sxp, yt + ht * 0.25, 0.3 * k, ht * 0.45);
      ctx.fillStyle = 'rgba(10,0,30,0.6)';
      for (let i = 1; i < 5; i++) ctx.fillRect(sxp, yt + ht * 0.25 + i * ht * 0.09, 0.3 * k, Math.max(1, 0.04 * k));
    }
    // antena con luz roja
    if (b.antenna) {
      const cx = L + Wd * 0.5, ah = 1.4 * k;
      ctx.fillStyle = '#3a2a5a'; ctx.fillRect(cx - Math.max(0.5, 0.03 * k), yt - ah, Math.max(1, 0.06 * k), ah);
      if (Math.sin(time * 3 + b.phase) > 0) {
        ctx.globalCompositeOperation = 'lighter';
        glow(cx, yt - ah, Math.max(3, 0.35 * k), '255,40,60', 0.9 * a);
        ctx.globalCompositeOperation = 'source-over';
      }
    }
  }
  ctx.globalAlpha = 1;
}

function drawLamp(l) {
  const a = fog(l.z); if (a <= 0 || l.z < 0.4) return;
  ctx.globalAlpha = a;
  const s = l.side, x = sx(s * 2.45, l.z), yb = sy(l.z), k = K * sc(l.z), top = yb - 3.4 * k;
  const ax = sx(s * 1.95, l.z);
  ctx.fillStyle = '#2a1a48';
  ctx.fillRect(x - 0.06 * k, top, 0.12 * k, 3.4 * k);
  ctx.fillRect(Math.min(x, ax), top, Math.abs(ax - x), 0.1 * k);
  ctx.fillStyle = l.col; ctx.fillRect(ax - 0.12 * k, top + 0.08 * k, 0.24 * k, 0.07 * k);
  ctx.globalCompositeOperation = 'lighter';
  const rgb = l.col === '#00eaff' ? '0,234,255' : '255,79,216';
  glow(ax, top + 0.12 * k, 0.9 * k, rgb, 0.55 * a);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

function drawCar(xw, z, spr, isPlayer) {
  const a = fog(z); if (a <= 0) return;
  ctx.globalAlpha = a;
  const s = sc(z), w = CARW * K * s, h = w * spr.height / spr.width;
  const cx = sx(xw, z), yb = sy(z), x = cx - w / 2, y = yb - h * 0.96;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.ellipse(cx, yb - h * 0.02, w * 0.52, w * 0.07, 0, 0, Math.PI * 2); ctx.fill();
  if (isPlayer) {
    ctx.globalCompositeOperation = 'lighter';
    glow(cx, yb, w * 0.6, '0,234,255', 0.35);
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(spr, x, y, w, h);
  ctx.imageSmoothingEnabled = true;
  // brillo de luces traseras
  ctx.globalCompositeOperation = 'lighter';
  const gy = y + h * (18.5 / 34);
  glow(x + w * (10.5 / 42), gy, w * 0.17, '255,40,70', 0.55 * a);
  glow(x + w * (31.5 / 42), gy, w * 0.17, '255,40,70', 0.55 * a);
  glow(cx, y + h * (5.5 / 34), w * 0.09, '255,40,70', 0.4 * a);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

function drawItem(it) {
  const a = fog(it.z); if (a <= 0) return;
  ctx.globalAlpha = a;
  const k = K * sc(it.z), cx = sx(it.xw, it.z), yb = sy(it.z);
  if (it.kind === 'oil' || it.kind === 'mud') {
    // charco plano en el suelo
    const rx = 0.5 * k, ry = 0.13 * k, cy = yb - ry;
    ctx.globalCompositeOperation = 'lighter';
    glow(cx, cy, rx * 1.2, '255,40,60', 0.25 * a);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = it.kind === 'oil' ? '#05030a' : '#5a3416';
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    if (it.kind === 'oil') {
      const g = ctx.createLinearGradient(cx - rx, 0, cx + rx, 0);
      g.addColorStop(0, '#b14bff'); g.addColorStop(0.5, '#22d39a'); g.addColorStop(1, '#00eaff');
      ctx.strokeStyle = g; ctx.lineWidth = Math.max(1, 0.03 * k);
      ctx.beginPath(); ctx.ellipse(cx - rx * 0.1, cy - ry * 0.1, rx * 0.6, ry * 0.5, 0, 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.fillStyle = '#3a200c';
      ctx.beginPath(); ctx.ellipse(cx - rx * 0.4, cy, rx * 0.25, ry * 0.4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx + rx * 0.35, cy - ry * 0.2, rx * 0.2, ry * 0.35, 0, 0, Math.PI * 2); ctx.fill();
    }
  } else {
    // objeto flotando
    const size = 0.55 * k, bob = Math.sin(time * 4 + it.ph) * 0.08 * k;
    const y = yb - 0.45 * k - size + bob;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.ellipse(cx, yb - 0.03 * k, size * 0.4, size * 0.1, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    glow(cx, y + size / 2, size * 1.1, ITEM_GLOW[it.kind], 0.55 * a);
    ctx.globalCompositeOperation = 'source-over';
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(ITEM_SPR[it.kind], cx - size / 2, y, size, size);
    ctx.imageSmoothingEnabled = true;
  }
  ctx.globalAlpha = 1;
}

function shieldPath(cx, t, w, h) {
  const l = cx - w / 2, r = cx + w / 2;
  ctx.beginPath();
  ctx.moveTo(l, t + h * 0.08);
  ctx.quadraticCurveTo(cx - w * 0.25, t + h * 0.1, cx, t);
  ctx.quadraticCurveTo(cx + w * 0.25, t + h * 0.1, r, t + h * 0.08);
  ctx.lineTo(r, t + h * 0.5);
  ctx.bezierCurveTo(r, t + h * 0.78, cx + w * 0.18, t + h * 0.92, cx, t + h);
  ctx.bezierCurveTo(cx - w * 0.18, t + h * 0.92, l, t + h * 0.78, l, t + h * 0.5);
  ctx.closePath();
}
function drawShield() {
  if (fx.shield <= 0 || (fx.shield < 2 && Math.sin(time * 20) < 0)) return;
  const cw = CARW * K * sc(PZ), ch = cw * 34 / 42;
  const cx = sx(player.xw, PZ), cyCar = sy(PZ) - ch * 0.5;
  const w = cw * 1.45, h = w * 1.15, t = cyCar - h * 0.52;
  const pulse = 0.5 + 0.5 * Math.sin(time * 5);

  ctx.save();
  // relleno azul translúcido
  shieldPath(cx, t, w, h);
  const g = ctx.createLinearGradient(0, t, 0, t + h);
  g.addColorStop(0, 'rgba(120,200,255,0.32)'); g.addColorStop(1, 'rgba(20,90,255,0.14)');
  ctx.fillStyle = g; ctx.fill();
  // panal de energía dentro
  ctx.clip();
  ctx.strokeStyle = `rgba(160,220,255,${0.15 + 0.1 * pulse})`; ctx.lineWidth = 1;
  const hr = Math.max(5, w / 12);
  for (let row = 0, y = t; y < t + h + hr; row++, y += hr * 1.5) {
    for (let x = cx - w / 2 - hr + (row % 2) * hr * 0.87; x < cx + w / 2 + hr; x += hr * 1.73) {
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const an = Math.PI / 6 + i * Math.PI / 3;
        const px = x + Math.cos(an) * hr, py = y + Math.sin(an) * hr;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath(); ctx.stroke();
    }
  }
  // brillo que cruza el escudo
  const sxp = cx - w + ((time * 0.6) % 1) * w * 2;
  const sh = ctx.createLinearGradient(sxp - 20, 0, sxp + 20, 0);
  sh.addColorStop(0, 'rgba(255,255,255,0)'); sh.addColorStop(0.5, 'rgba(255,255,255,0.28)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sh; ctx.fillRect(cx - w / 2, t, w, h);
  ctx.restore();

  // borde exterior con brillo y borde interior
  shieldPath(cx, t, w, h);
  ctx.strokeStyle = '#7fd8ff'; ctx.lineWidth = 4; ctx.shadowColor = '#2a9dff'; ctx.shadowBlur = 18 + pulse * 10;
  ctx.stroke(); ctx.shadowBlur = 0;
  shieldPath(cx, t + h * 0.05, w * 0.86, h * 0.86);
  ctx.strokeStyle = 'rgba(220,240,255,0.7)'; ctx.lineWidth = 1.5; ctx.stroke();
}

function drawEffects() {
  if (fx.fog > 0) {
    // entra y sale suave
    const a = Math.min(1, fx.fog / 0.8, (5 - fx.fog) / 0.6 + 0.001);
    const yHide = sy(9), yEnd = sy(6);
    // capa base espesa (tapa lo lejano)
    const g = ctx.createLinearGradient(0, HOR - 80, 0, yEnd);
    g.addColorStop(0, `rgba(95,75,130,${0.9 * a})`);
    g.addColorStop((yHide - HOR + 80) / (yEnd - HOR + 80), `rgba(110,90,145,${0.85 * a})`);
    g.addColorStop(1, 'rgba(110,90,145,0)');
    ctx.fillStyle = g; ctx.fillRect(0, HOR - 80, W, yEnd - HOR + 80);
    // nubes con volumen
    for (const p of fogPuffs) {
      const y = p.y + Math.sin(time * 0.7 + p.p) * 6;
      const rg = ctx.createRadialGradient(p.x, y, 0, p.x, y, p.r);
      const c = p.dark ? '70,52,105' : '175,160,205';
      rg.addColorStop(0, `rgba(${c},${0.55 * a})`);
      rg.addColorStop(0.6, `rgba(${c},${0.25 * a})`);
      rg.addColorStop(1, `rgba(${c},0)`);
      ctx.fillStyle = rg; ctx.fillRect(p.x - p.r, y - p.r, p.r * 2, p.r * 2);
    }
    // jirones cerca de ti (te sientes dentro)
    for (const p of fogWisps) {
      const y = p.y + Math.sin(time + p.p) * 10;
      const rg = ctx.createRadialGradient(p.x, y, 0, p.x, y, p.r);
      rg.addColorStop(0, `rgba(190,175,220,${0.16 * a})`); rg.addColorStop(1, 'rgba(190,175,220,0)');
      ctx.fillStyle = rg; ctx.fillRect(p.x - p.r, y - p.r, p.r * 2, p.r * 2);
    }
  }
  if (fx.mud > 0) {
    ctx.globalAlpha = Math.min(1, fx.mud) * 0.7; ctx.fillStyle = '#4a2a10';
    [[40, H - 30, 70], [W - 50, H - 20, 80], [120, H - 5, 50], [W - 140, H - 8, 45]].forEach(([x, y, r]) => {
      ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.6, 0, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
  }
  if (fx.slow > 0) { ctx.fillStyle = `rgba(80,200,255,${Math.min(1, fx.slow) * 0.08})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- Texto / UI ----------
function txt(t, x, y, size, col, align = 'center', glowOn = true) {
  ctx.font = `${size}px 'Press Start 2P', monospace`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (glowOn) { ctx.shadowColor = col; ctx.shadowBlur = 12; }
  ctx.fillStyle = col; ctx.fillText(t, x, y); ctx.shadowBlur = 0;
}
function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(10,0,25,0.8)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, 10); else ctx.rect(x, y, w, h);
  ctx.fill();
  ctx.strokeStyle = '#c14bff'; ctx.lineWidth = 2; ctx.shadowColor = '#c14bff'; ctx.shadowBlur = 14;
  ctx.stroke(); ctx.shadowBlur = 0;
}
const blink = () => Math.sin(time * 5) > -0.3;

function drawHUD() {
  panel(12, 12, 200, 52);
  txt('PUNTOS', 26, 30, 9, '#ff8fe6', 'left', false);
  txt(String(Math.floor(score)), 26, 50, 16, '#00eaff', 'left');
  panel(W - 152, 12, 140, 52);
  txt('NIVEL ' + level, W - 82, 30, 11, '#ffd84a');
  txt(Math.round(effSpeed() * 9) + ' KM/H', W - 82, 50, 9, '#ff8fe6', 'center', false);
  // efectos activos
  const FXL = [['shield', 'ESCUDO', '#00eaff', 8], ['x2', 'PUNTOS X2', '#b14bff', 7], ['slow', 'CAMARA LENTA', '#9af6ff', 4],
               ['invert', 'AL REVES', '#ff3a5a', 4], ['mud', 'BARRO', '#d08a40', 3], ['fog', 'NIEBLA', '#ff3a5a', 5]];
  let fy = 76;
  for (const [k, label, col, max] of FXL) {
    if (fx[k] <= 0) continue;
    ctx.fillStyle = 'rgba(10,0,25,0.75)'; ctx.fillRect(12, fy, 200, 30);
    txt(label, 22, fy + 11, 8, col, 'left', false);
    ctx.fillStyle = col; ctx.fillRect(22, fy + 21, 180 * (fx[k] / max), 4);
    fy += 36;
  }
  popups.forEach((p, i) => {
    ctx.globalAlpha = Math.min(1, p.t * 1.5);
    txt(p.text, W / 2, H * 0.34 - (1.4 - p.t) * 40 + i * 30, 16, p.col);
    ctx.globalAlpha = 1;
  });
  if (lvlBanner > 0) {
    ctx.globalAlpha = Math.min(1, lvlBanner);
    txt('NIVEL ' + level, W / 2, H * 0.48, 30, '#ffd84a');
    txt('MAS RAPIDO!', W / 2, H * 0.48 + 40, 14, '#ff4fd8');
    ctx.globalAlpha = 1;
  }
}

function drawMenu() {
  panel(W / 2 - 230, 150, 460, 250);
  txt('RETROWAVE', W / 2, 205, 34, '#ff4fd8');
  txt('RACER', W / 2, 255, 34, '#00eaff');
  if (blink()) txt('PULSA ENTER', W / 2, 320, 16, '#ffd84a');
  txt('<- ->  CAMBIA DE CARRIL', W / 2, 360, 10, '#cfa6ff', 'center', false);
  const best = loadTop()[0];
  if (best) txt('RECORD: ' + best.name + ' ' + best.score, W / 2, 385, 9, '#ff8fe6', 'center', false);
}

function drawName() {
  panel(W / 2 - 240, 140, 480, 290);
  txt('CHOCASTE!', W / 2, 185, 28, '#ff4fd8');
  txt('PUNTOS: ' + Math.floor(score), W / 2, 230, 14, '#00eaff');
  txt('NUEVO RECORD TOP 10', W / 2, 270, 12, '#ffd84a');
  txt('ESCRIBE TU NOMBRE', W / 2, 300, 10, '#cfa6ff', 'center', false);
  ctx.strokeStyle = '#00eaff'; ctx.lineWidth = 2; ctx.strokeRect(W / 2 - 140, 320, 280, 44);
  txt(nameBuf + (blink() ? '_' : ' '), W / 2, 343, 18, '#ffffff');
  txt('ENTER PARA GUARDAR', W / 2, 400, 10, '#ff8fe6', 'center', false);
}

function drawOver() {
  panel(W / 2 - 250, 60, 500, 600);
  txt('CHOCASTE!', W / 2, 105, 28, '#ff4fd8');
  txt('PUNTOS: ' + Math.floor(score), W / 2, 148, 14, '#00eaff');
  txt('TOP 10 PILOTOS', W / 2, 200, 16, '#ffd84a');
  const l = loadTop();
  for (let i = 0; i < 10; i++) {
    const it = l[i], y = 245 + i * 34;
    const col = i === lastRank ? '#00eaff' : i === 0 ? '#ffd84a' : '#ff8fe6';
    if (i === lastRank) { ctx.fillStyle = 'rgba(0,234,255,0.12)'; ctx.fillRect(W / 2 - 220, y - 15, 440, 30); }
    txt(String(i + 1).padStart(2, '0'), W / 2 - 200, y, 12, col, 'left', false);
    txt(it ? it.name : '--------', W / 2 - 140, y, 12, col, 'left', false);
    txt(it ? String(it.score) : '---', W / 2 + 200, y, 12, col, 'right', false);
  }
  if (blink()) txt('ENTER PARA JUGAR', W / 2, 625, 12, '#00eaff');
}

function render() {
  ctx.clearRect(0, 0, W, H);
  drawSky(); drawGround(); drawRoad();
  const list = [...buildings, ...lamps, ...obs, ...items, { type: 'p', z: PZ }];
  list.sort((a, b) => b.z - a.z);
  for (const it of list) {
    if (it.type === 'b') drawBuilding(it);
    else if (it.type === 'l') drawLamp(it);
    else if (it.type === 'o') drawCar(it.xw, it.z, it.spr, false);
    else if (it.type === 'i') drawItem(it);
    else { drawCar(player.xw, PZ, PLAYER_SPR, true); drawShield(); }
  }
  drawEffects();
  if (state === 'play') drawHUD();
  else if (state === 'menu') drawMenu();
  else if (state === 'name') drawName();
  else drawOver();
  if (flash > 0) { ctx.fillStyle = `rgba(${flashRGB},${flash * 0.7})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- Bucle (independiente de los FPS = movimiento suave) ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- Controles ----------
addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' ', 'Enter', 'Backspace'].includes(k)) e.preventDefault();
  if (state === 'play') {
    if (e.repeat) return;
    const left = k === 'ArrowLeft' || k === 'a' || k === 'A';
    const right = k === 'ArrowRight' || k === 'd' || k === 'D';
    const dir = (left ? -1 : right ? 1 : 0) * (fx.invert > 0 ? -1 : 1);
    if (dir) player.lane = Math.max(0, Math.min(3, player.lane + dir));
  } else if (state === 'name') {
    if (k === 'Enter') { lastRank = pushScore(nameBuf || 'PILOTO', Math.floor(score)); state = 'over'; }
    else if (k === 'Backspace') nameBuf = nameBuf.slice(0, -1);
    else if (/^[a-zA-Z0-9]$/.test(k) && nameBuf.length < 8) nameBuf += k.toUpperCase();
  } else if (k === 'Enter') reset();
});
</script>
